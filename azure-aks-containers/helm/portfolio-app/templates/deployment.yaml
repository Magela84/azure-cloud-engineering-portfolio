apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  # Kubernetes keeps this many pods alive. Kill one and it rebuilds it.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Changing the ConfigMap alone won't restart pods. Hashing its contents
        # into an annotation forces a rollout when the page changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: app
          # Pulled from YOUR private ACR — the cluster's managed identity holds
          # AcrPull, so there is no registry secret anywhere.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
          {{- if .Values.probes.enabled }}
          # Liveness: is it alive? Fail -> restart the container.
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: ready for traffic? Fail -> pull it out of the Service.
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- end }}
      volumes:
        - name: web
          configMap:
            name: {{ .Release.Name }}-web
