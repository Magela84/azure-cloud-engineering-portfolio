apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  # LoadBalancer asks Azure for a public IP and wires it to the pods.
  type: {{ .Values.service.type }}
  selector:
    # This is the whole trick: the Service finds pods by label,
    # so pods can come and go and traffic keeps flowing.
    app: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
