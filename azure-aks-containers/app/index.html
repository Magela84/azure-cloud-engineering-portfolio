<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Running on AKS</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0b0f17; color:#e6edf6;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { text-align:center; padding:48px 56px; border:1px solid #1f2937;
          border-radius:16px; background:#131a27; }
  h1 { margin:0 0 10px; font-size:2rem; letter-spacing:-0.02em; }
  p  { margin:0; color:#9aa7b8; }
  .pod { margin-top:22px; font-family:ui-monospace,Consolas,monospace;
         font-size:0.85rem; color:#38bdf8; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
         background:#34d399; margin-right:8px; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>Running on Azure Kubernetes Service</h1>
    <p>Containerized with Docker · Built in ACR · Deployed with Helm</p>
    <p class="pod">pod: <span id="host">…</span></p>
  </div>
<script>
  // The pod's hostname is its name — proves which replica served you.
  document.getElementById('host').textContent = location.hostname;
</script>
</body>
</html>
